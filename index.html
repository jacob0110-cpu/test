        .controls {

            backdrop-filter: blur(10px); display: flex; justify-content: space-between;

            padding-bottom: max(15px, env(safe-area-inset-bottom));

        button.nav-btn {
            background: #1E293B; color: white; border: none;

        .page-indicator { font-weight: 600; color: #475569; font-size: 0.95em; white-space: nowrap; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media print {
            body, html { background-color: white !important; height: auto !important; overflow: visible !important; }
            .app-container { max-width: 100% !important; height: auto !important; box-shadow: none !important; }
            .content-scroll { overflow: visible !important; height: auto !important; padding: 0 !important; }
            
            .page { display: none !important; animation: none !important; padding: 20px 0 !important; }
            .page.active { display: block !important; page-break-after: avoid; }
            
            body.print-all .page { display: block !important; page-break-after: always; }
            body.print-all .page:last-child { page-break-after: auto; }
            
            .controls, .btn-camera, .btn-remove-photo, .save-status, .btn-web, .weather-loading { display: none !important; }
            .editable-field, .user-input-section textarea { border: 1px solid #000; background: #fff; height: auto; }
            .payment-input { border: none !important; background: transparent !important; padding: 0 !important; text-align: right !important;}
            .photo-item { page-break-inside: avoid; }
            .map-container { height: 300px !important; }
            #upcoming-deadlines-container { display: none !important; }
        }
    </style>
</head>

<script type="module">

    const db = getFirestore(app);

    // ==========================================

    // ==========================================
    const stays = [
        { date: "10/13 - 10/15 (奧斯陸)", hotel: "BJØRVIKA APARTMENTS", address: "Schweigaardsgate 15B, 0191 Oslo", phone: "+47 48 60 53 33", checkIn: "15:00 起", checkOut: "11:00 前", room: "大型雙臥室公寓 & 單臥室公寓", bookingRef: "確認碼: 5767.848.273\nPIN碼: 5289", lat: 59.9139, lon: 10.7522, notes: "入住人數：6位成人。抵達前需支付全額並簽署租賃合約。入住時須支付 NOK 5000 損壞押金。", mapQuery: "Schweigaardsgate+15B,+0191+Oslo", webUrl: "https://www.google.com/search?q=BJØRVIKA+APARTMENTS,+Teaterplassen,+Oslo", paymentDeadline: "2026-09-29", deadlineNote: "入住前 14 天需線上預付，此日前可免費取消" },
        { date: "10/15 - 10/17 (瑟弗根)", hotel: "The Tide - Rorbuer", address: "Besselvågveien 8A, 8392 Sørvågen", phone: "+47 76 09 21 00", checkIn: "16:00 - 23:00", checkOut: "11:00 前", room: "海景高級小屋", bookingRef: "確認碼: 6311.068.839\nPIN碼: 2677", lat: 67.8893, lon: 13.0207, notes: "入住人數：6位成人。小屋位於港邊，距離接待櫃台約700公尺。", mapQuery: "Besselvågveien+8A,+8392+Sørvågen", webUrl: "https://www.google.com/search?q=The+Tide+-+Rorbuer+Sørvågen" },
        { date: "10/17 - 10/18 (巴爾斯塔)", hotel: "謝爾斯塔漁人碼頭公寓", address: "Moloveien 41, 8373 Ballstad", phone: "+47 40 46 33 33", checkIn: "15:00 - 21:00", checkOut: "08:00 - 11:00", room: "三臥室房屋", bookingRef: "確認碼: 5967.528.612\nPIN碼: 2370", lat: 68.0722, lon: 13.5511, notes: "入住人數：6位成人。無須預先付款，將於入住期間以 NOK 結帳。", mapQuery: "Moloveien+41,+8373+Ballstad", webUrl: "https://www.solsiden-brygge.no/", paymentDeadline: "2026-10-09", deadlineNote: "前可免費取消 (現場付款)" },
        { date: "10/19 - 10/21 (特羅姆瑟)", hotel: "Skaret by VANDER", address: "25 Storgata, 9008 Tromsø", phone: "+47 48 60 53 33", checkIn: "15:00 起", checkOut: "11:00 前", room: "海景雙臥室公寓", bookingRef: "確認碼: 6984.388.843\nPIN碼: 0746", lat: 69.6492, lon: 18.9553, notes: "入住人數：6位成人。館內無接待櫃台，入住前14天會收取 NOK 5000 損壞押金。", mapQuery: "Storgata+25,+9008+Tromsø", webUrl: "https://vanderapartments.com/tromso", paymentDeadline: "2026-10-04", deadlineNote: "前可免費取消" },
        { date: "10/21 - 10/22 (羅瓦涅米)", hotel: "北極城市酒店", address: "Pekankatu 9, Rovaniemi", phone: "請查閱訂房信件確認", checkIn: "15:00 以後", checkOut: "12:00 以前", room: "經典雙人房 * 3間", bookingRef: "訂單編號: ORD0029814012 / 14004\n飯店確認號: 54259329 / 331 / 207", lat: 66.5039, lon: 25.7294, notes: "包含 10/22 早餐。入住名單：LAI YAKO, LEE HSUHSIU, YANG TENGCHUN。", mapQuery: "Pekankatu+9,+Rovaniemi", webUrl: "https://arcticcityhotel.fi/", paymentDeadline: "2026-10-18", deadlineNote: "10/18 已自動扣款 (取消期限 10/21 04:00)" },
        { date: "10/23 - 10/26 (赫爾辛基)", hotel: "Bob W Helsinki City Centre", address: "Vuorikatu 18 B, 00100 Helsinki", phone: "+358 9 42450197", checkIn: "15:00 起", checkOut: "11:00 前", room: "3 Bedroom - Kitchen - Sauna - Balcony", bookingRef: "確認碼: 6698.147.253\nPIN碼: 3424", lat: 60.1695, lon: 24.9354, notes: "入住人數：6位成人。房價包含附近咖啡廳早餐 (一至五 07:30-10:30，六 07:30-12:00，日 09:00-12:00)。", mapQuery: "Vuorikatu+18+B,+00100+Helsinki", webUrl: "https://bobw.co/", paymentDeadline: "2026-10-19", deadlineNote: "前可免費取消" },
        { date: "10/26 - 10/27 (慕尼黑)", hotel: "宜必思尚品慕尼黑機場酒店", address: "Nordallee 31, Freising", phone: "請查閱訂房信件確認", checkIn: "15:00 以後", checkOut: "12:00 以前", room: "時尚標準雙床房 * 3間", bookingRef: "訂單編號: ORD0029843565\n飯店確認號: 2610260500", lat: 48.3537, lon: 11.7501, notes: "不含餐食。入住名單：LEE HSUHSIU, YANG TENGCHUN, LAI YAKO。", mapQuery: "Nordallee+31,+Freising", webUrl: "https://all.accor.com/", paymentDeadline: "2026-10-23", deadlineNote: "10/23 已自動扣款 (取消期限 10/26 06:59)" }
    ];

    let currentPage = 0;
    const totalPages = stays.length + 1;
    const container = document.getElementById('accom-book');
    let saveTimeout;

    // ==========================================
    // 雲端資料庫 Firebase Firestore (負責文字、付款狀態)
    // ==========================================
    async function writeToFirebase(index, field, value) {
        try {
            const docRef = doc(db, "Accommodations", `stay_${index}`);
            await setDoc(docRef, { [field]: value }, { merge: true });
            showSaveStatus(index);
        } catch (error) {
            console.error("寫入 Firebase 失敗:", error);
        }
    }

    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }
    const debouncedSaveData = debounce(writeToFirebase, 800);

    window.saveData = function(index, field, value) {
        debouncedSaveData(index, field, value);
    };

    window.savePayment = function(index) {
        const status = document.getElementById(`pay-status-${index}`).value;
        const date = document.getElementById(`pay-date-${index}`).value;
        const amount = document.getElementById(`pay-amount-${index}`).value;
        writeToFirebase(index, "payment", { status, date, amount });
    };

    function showSaveStatus(index) {
        const statusEl = document.getElementById(`save-status-${index}`);
        if (statusEl) {
            statusEl.innerText = "✓ 雲端已同步";
            statusEl.style.opacity = 1;
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => { statusEl.style.opacity = 0; }, 2000);
        }
    }

    // ==========================================
    // 本機資料庫 IndexedDB (負責照片及PDF)
    // ==========================================
    const DB_NAME = 'TravelManualDB';
    const STORE_NAME = 'AccomPhotos';
    
    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function savePhotosToDB(index, photosArr) {
        const db_local = await initDB();
        const tx = db_local.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(photosArr, `photos-${index}`);
        return new Promise(resolve => tx.oncomplete = resolve);
    }

    async function getPhotosFromDB(index) {
        const db_local = await initDB();
        const tx = db_local.transaction(STORE_NAME, 'readonly');
        const request = tx.objectStore(STORE_NAME).get(`photos-${index}`);
        return new Promise(resolve => {
            request.onsuccess = () => resolve(request.result || []);
            request.onerror = () => resolve([]);
        });
    }

    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function compressImage(dataUrl) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width; let height = img.height;
                if (width > 800) { height *= 800 / width; width = 800; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.6));
            };
            img.onerror = reject; img.src = dataUrl;
        });
    }

    window.handlePhotoUpload = async function(event, index) {
        const files = event.target.files;
        if (!files || files.length === 0) return;
        
        let savedPhotos = await getPhotosFromDB(index);
        
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            try {
                const dataUrl = await readFileAsDataURL(file);
                if (file.type === 'application/pdf') {
                    savedPhotos.push({ type: 'pdf', data: dataUrl });
                } else {
                    const compressed = await compressImage(dataUrl);
                    savedPhotos.push({ type: 'image', data: compressed });
                }
            } catch (err) { alert("檔案處理失敗！"); }
        }
        
        await savePhotosToDB(index, savedPhotos);
        window.renderPhotos(index, savedPhotos);
        
        const statusEl = document.getElementById(`save-status-${index}`);
        if(statusEl) {
            statusEl.innerText = "✓ 檔案已存入本機";
            statusEl.style.opacity = 1;
            setTimeout(() => { statusEl.style.opacity = 0; }, 2000);
        }
        event.target.value = '';
    };

    window.renderPhotos = function(index, photos) {
        const previewContainer = document.getElementById(`photo-preview-container-${index}`);
        previewContainer.innerHTML = ''; 
        photos.forEach((photo, photoIndex) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'photo-item';
            const btn = document.createElement('button');
            btn.className = 'btn-remove-photo'; btn.innerHTML = '✕';
            btn.onclick = () => window.removePhoto(index, photoIndex);
            itemDiv.appendChild(btn);
            
            if (photo.type === 'pdf') {
                const iframe = document.createElement('iframe');
                iframe.src = photo.data; itemDiv.appendChild(iframe);
            } else {
                const img = document.createElement('img');
                img.src = photo.data; itemDiv.appendChild(img);
            }
            previewContainer.appendChild(itemDiv);
        });
    };

    window.removePhoto = async function(index, photoIndex) {
        if(confirm("確定要刪除這份憑證/收據嗎？")) {
            let savedPhotos = await getPhotosFromDB(index);
            savedPhotos.splice(photoIndex, 1);
            await savePhotosToDB(index, savedPhotos);
            window.renderPhotos(index, savedPhotos);
        }
    };

    // ==========================================
    // 天氣 API 串接 Open-Meteo
    // ==========================================
    function getWeatherDesc(code) {
        if (code === 0) return "☀️ 晴朗無雲";
        if (code <= 3) return "⛅ 晴時多雲";
        if (code === 45 || code === 48) return "🌫 起霧";
        if (code >= 51 && code <= 67) return "🌧 陣雨 / 降雨";
        if (code >= 71 && code <= 77) return "❄️ 降雪";
        if (code >= 80 && code <= 82) return "🌦 陣雨";
        if (code >= 85 && code <= 86) return "🌨 陣雪";
        if (code >= 95) return "⛈ 雷陣雨";
        return "🌥 陰天";
    }

    async function fetchWeather(stayIndex) {
        const weatherBox = document.getElementById(`weather-${stayIndex}`);
        if (!weatherBox || weatherBox.dataset.loaded === "true") return;

        const stay = stays[stayIndex];
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${stay.lat}&longitude=${stay.lon}&current_weather=true`);
            const data = await res.json();
            const temp = data.current_weather.temperature;
            const code = data.current_weather.weathercode;
            
            weatherBox.innerHTML = `
                <div><strong>🌡️ 即時氣溫：</strong> ${temp}°C</div>
                <div><strong>🌤 當前天氣：</strong> ${getWeatherDesc(code)}</div>
            `;
            weatherBox.dataset.loaded = "true";
        } catch (error) {
            weatherBox.innerHTML = `<div class="weather-loading" style="color:#64748B;">即時天氣無法載入</div>`;
        }
    }

    // ==========================================
    // 介面渲染與導覽
    // ==========================================
    async function renderBook() {
        let html = `
            <div class="page active" id="page-0">
                <h2 class="hotel-name">🗺️ 北歐跨國住宿與路線總覽</h2>
                <div class="map-container" style="height: 320px;">
                    <iframe src="https://maps.google.com/maps?saddr=Oslo,Norway&daddr=Sørvågen,Norway+to:Ballstad,Norway+to:Tromsø,Norway+to:Rovaniemi,Finland+to:Helsinki,Finland+to:Munich,Germany&output=embed" loading="lazy"></iframe>
                </div>

                <!-- 動態注入的即將到來期限區塊將放在這裡 -->
                <div id="upcoming-deadlines-container"></div>

                <div class="info-card">
                    <h3 style="margin-top:0; margin-bottom:15px; color:#1E293B; font-size:1.1em;">📅 住宿行程總表</h3>
                    ${stays.map(s => `
                        <div class="info-row horizontal">
                            <span class="info-label" style="min-width: 90px; color:#3B82F6; font-weight:bold;">${s.date.split(' ')[0]}</span>
                            <span class="info-value-static" style="text-align: left; max-width: 100%;">${s.hotel}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="notes-section" style="border-left-color: #10B981; background: #ECFDF5;">
                    <strong>✅ 系統狀態更新：</strong><br>
                    • <b>自動期限管理</b>：逾期的住宿項目將自動轉為「已付款」，七天內的期限會警示於首頁。<br>
                    • <b>雲端資料庫已連線</b>：所有文字與付款資料將自動備份至 Firebase。<br>
                    • <b>大容量存儲</b>：照片與 PDF 文件將安全存儲於設備本機。
                </div>
            </div>
        `;

        stays.forEach((item, index) => {
            let pageId = index + 1;
            html += `
                <div class="page" id="page-${pageId}">
                    <div class="type-badge">📍 ${item.date}</div>
                    <h2 class="hotel-name">${item.hotel}</h2>
                    <div class="info-card">
                        <div class="info-row horizontal"><span class="info-label">地址</span><span class="info-value-static">${item.address}</span></div>
                        <div class="info-row horizontal"><span class="info-label">聯絡電話</span><span class="info-value-static">${item.phone}</span></div>
                        <div class="info-row horizontal"><span class="info-label">Check-in</span><span class="info-value-static">${item.checkIn}</span></div>
                        <div class="info-row horizontal" style="border-bottom: none; padding-bottom: 0;"><span class="info-label">Check-out</span><span class="info-value-static">${item.checkOut}</span></div>
                    </div>

                    <div class="info-card">
                        <div class="info-row">
                            <span class="info-label">✏️ 訂單編號 / 確認碼 / PIN碼</span>
                            <textarea class="editable-field" id="ref-${index}" oninput="saveData(${index}, 'ref', this.value)" placeholder="請輸入訂房確認碼...">${item.bookingRef}</textarea>
                        </div>
                        <div class="info-row" style="border-bottom: none; padding-bottom: 0;">
                            <span class="info-label">✏️ 房型 / 床位分配</span>
                            <textarea class="editable-field" id="room-${index}" oninput="saveData(${index}, 'room', this.value)" placeholder="請輸入房型與床位資訊...">${item.room}</textarea>
                        </div>
                    </div>
                    
                    <div class="payment-section">
                        <h3 style="margin: 0 0 15px 0; font-size: 1.05em; color: #0F172A;">💰 付款紀錄</h3>
                        <div class="payment-row">
                            <span class="info-label" style="width: 70px;">付款狀態</span>
                            <select class="payment-input" id="pay-status-${index}" onchange="savePayment(${index})">
                                <option value="">選擇狀態</option>
                                <option value="已付款">✅ 已付款</option>
                                <option value="未付款">⏳ 尚未付款</option>
                                <option value="現場付">🏨 現場結帳</option>
                            </select>
                        </div>
                        <div class="payment-row">
                            <span class="info-label" style="width: 70px;">付款日期</span>
                            <input type="date" class="payment-input" id="pay-date-${index}" onchange="savePayment(${index})">
                        </div>
                        <div class="payment-row">
                            <span class="info-label" style="width: 70px;">付款金額</span>
                            <input type="text" class="payment-input" id="pay-amount-${index}" oninput="savePayment(${index})" placeholder="如：EUR 150">
                        </div>
                    </div>

                    <div class="photo-section">
                        <h3 style="margin: 0 0 10px 0; font-size: 1.05em; color: #0F172A;">📸 住宿憑證與收據存檔</h3>
                        <input type="file" id="file-upload-${index}" accept="image/*,application/pdf" multiple style="display:none;" onchange="handlePhotoUpload(event, ${index})">
                        <button class="btn-camera" onclick="document.getElementById('file-upload-${index}').click()">
                            ➕ 點此選擇照片、文件或拍照
                        </button>
                        <div class="photo-preview-container" id="photo-preview-container-${index}"></div>
                    </div>

                    <div class="climate-section" id="weather-${index}">
                        <div class="weather-loading">🔄 正在連線取得即時天氣...</div>
                    </div>

                    <div class="notes-section"><strong>⚠️ 系統原始備註：</strong><br>${item.notes.replace(/\n/g, '<br>')}</div>

                    <div class="user-input-section">
                        <div style="font-weight: 600; color: #64748B; margin-bottom: 8px;">✏️ 個人補充事項</div>
                        <textarea id="note-${index}" oninput="saveData(${index}, 'note', this.value)" placeholder="點此輸入您的住宿備忘錄..."></textarea>
                        <span class="save-status" id="save-status-${index}"></span>
                    </div>

                    <a href="${item.webUrl}" target="_blank" class="btn-web" rel="noopener noreferrer">🌐 前往飯店網頁 / 搜尋資訊</a>

                    <div class="map-container">
                        <iframe src="https://maps.google.com/maps?q=${item.mapQuery}&t=&z=14&ie=UTF8&iwloc=&output=embed" loading="lazy"></iframe>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;

        // 計算期限邏輯準備 (取得當前本地時間 00:00:00)
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const oneWeekLater = new Date(today);
        oneWeekLater.setDate(today.getDate() + 7);
        let upcomingDeadlines = [];

        // 向 Firebase 請求並掛載資料，同時進行期限判斷
        for (let index = 0; index < stays.length; index++) {
            let paymentData = { status: "", date: "", amount: "" };

            try {
                const docSnap = await getDoc(doc(db, "Accommodations", `stay_${index}`));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if(data.ref) document.getElementById(`ref-${index}`).value = data.ref;
                    if(data.room) document.getElementById(`room-${index}`).value = data.room;
                    if(data.note) document.getElementById(`note-${index}`).value = data.note;
                    
                    if(data.payment) {
                        paymentData = data.payment;
                        if(paymentData.status) document.getElementById(`pay-status-${index}`).value = paymentData.status;
                        if(paymentData.date) document.getElementById(`pay-date-${index}`).value = paymentData.date;
                        if(paymentData.amount) document.getElementById(`pay-amount-${index}`).value = paymentData.amount;
                    }
                }
            } catch(e) {
                console.error("載入 Firebase 資料失敗:", e);
            }

            // 檢查該飯店是否有設定付款/取消期限
            const stay = stays[index];
            if (stay.paymentDeadline) {
                const [y, m, d] = stay.paymentDeadline.split('-');
                const deadlineDate = new Date(y, m - 1, d);

                // 判斷 1: 如果「當前日期」已經超過「期限日期」，自動將狀態改為已付款
                if (today > deadlineDate) {
                    if (paymentData.status !== "已付款") {
                        paymentData.status = "已付款";
                        if (!paymentData.date) paymentData.date = stay.paymentDeadline;
                        
                        document.getElementById(`pay-status-${index}`).value = "已付款";
                        document.getElementById(`pay-date-${index}`).value = paymentData.date;
                        
                        // 自動將核銷結果同步寫回 Firebase
                        writeToFirebase(index, "payment", paymentData);
                    }
                } 
                // 判斷 2: 尚未付款且期限在七天以內，將其推入提醒陣列
                else if (deadlineDate <= oneWeekLater) {
                    if (paymentData.status !== "已付款") {
                        upcomingDeadlines.push({
                            hotel: stay.hotel,
                            date: stay.paymentDeadline,
                            note: stay.deadlineNote
                        });
                    }
                }
            }

            // 載入本地照片
            let savedPhotosArr = await getPhotosFromDB(index);
            if (savedPhotosArr.length > 0) window.renderPhotos(index, savedPhotosArr);
        }

        // 若有即將到來的期限，渲染至首頁容器內
        const deadlineContainer = document.getElementById('upcoming-deadlines-container');
        if (deadlineContainer && upcomingDeadlines.length > 0) {
            deadlineContainer.innerHTML = `
                <div class="info-card" style="border-left: 4px solid #F59E0B; background: #FFFBEB;">
                    <h3 style="margin-top:0; margin-bottom:12px; color:#B45309; font-size:1.1em;">⚠️ 即將到來的付款與取消期限 (7天內)</h3>
                    ${upcomingDeadlines.map((d, i) => `
                        <div style="margin-bottom: ${i === upcomingDeadlines.length - 1 ? '0' : '8px'}; font-size: 0.95em; padding-bottom: ${i === upcomingDeadlines.length - 1 ? '0' : '8px'}; border-bottom:${i === upcomingDeadlines.length - 1 ? 'none' : '1px dashed #FCD34D'};">
                            <strong style="color: #D97706;">${d.date}</strong> - <strong>${d.hotel}</strong><br>
                            <span style="color: #92400E; font-size: 0.9em;">${d.note}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        updateButtons();
    }

    function updateButtons() {
        document.getElementById('btn-prev').disabled = currentPage === 0;
        document.getElementById('btn-next').disabled = currentPage === totalPages - 1;
        document.getElementById('page-text').innerText = `${currentPage + 1} / ${totalPages}`;
        document.getElementById('accom-book').scrollTop = 0; 

        if (currentPage > 0) {
            fetchWeather(currentPage - 1);
        }
    }

    window.nextPage = function() {
        if (currentPage < totalPages - 1) {
            document.getElementById(`page-${currentPage}`).classList.remove('active');
            currentPage++;
            document.getElementById(`page-${currentPage}`).classList.add('active');
            updateButtons();
        }
    };

    window.prevPage = function() {
        if (currentPage > 0) {
            document.getElementById(`page-${currentPage}`).classList.remove('active');
            currentPage--;
            document.getElementById(`page-${currentPage}`).classList.add('active');
            updateButtons();
        }
    };

    window.handlePrint = function() {
        if (currentPage === 0) document.body.classList.add('print-all');
        else document.body.classList.remove('print-all');
        setTimeout(() => { window.print(); }, 100);
    };

    // 初始化渲染
    renderBook();
</script>
</body>
</html>
